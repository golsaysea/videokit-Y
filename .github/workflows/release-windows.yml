name: Release macOS and Windows
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHON_EMBED_VERSION: '3.11.9'
jobs:
  build-windows:
    name: 🪟 Windows (x64)
    runs-on: windows-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: 📦 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 🐍 下载 Python Embedded
        shell: pwsh
        run: |
          $pythonUrl = "https://www.python.org/ftp/python/${{ env.PYTHON_EMBED_VERSION }}/python-${{ env.PYTHON_EMBED_VERSION }}-embed-amd64.zip"
          $pythonZip = "python-embed.zip"
          
          Write-Host "📥 下载 Python Embedded from $pythonUrl"
          Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonZip
          
          # 创建目录并解压
          New-Item -ItemType Directory -Force -Path "vendor/windows/python"
          Expand-Archive -Path $pythonZip -DestinationPath "vendor/windows/python" -Force
          Remove-Item $pythonZip
          
          # 修改 python311._pth 启用 site-packages
          $pthFile = "vendor/windows/python/python311._pth"
          @"
          python311.zip
          .
          Lib/site-packages
          import site
          "@ | Set-Content $pthFile -Encoding UTF8
          
          Write-Host "📄 python311._pth 内容:"
          Get-Content $pthFile
          
          # 下载 get-pip.py
          Write-Host "📥 下载 get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "vendor/windows/python/get-pip.py"
          
          # 创建 site-packages 目录
          New-Item -ItemType Directory -Force -Path "vendor/windows/python/Lib/site-packages"
          
          # 安装 pip
          Write-Host "🔧 安装 pip"
          & "vendor/windows/python/python.exe" "vendor/windows/python/get-pip.py" --no-warn-script-location
          
          # 安装依赖到 site-packages
          Write-Host "🔧 安装 Python 依赖"
          & "vendor/windows/python/python.exe" -m pip install -r requirements-edge.txt yt-dlp requests --target "vendor/windows/python/Lib/site-packages" --no-warn-script-location
          
          # 验证依赖安装
          Write-Host "🔍 验证 Flask 和 flask-cors 安装:"
          & "vendor/windows/python/python.exe" -c "import edge_tts, yt_dlp; print('Edge TTS runtime OK')"
          
          Write-Host "✅ Python Embedded 安装完成"
          dir "vendor/windows/python"
          dir "vendor/windows/python/Lib/site-packages"
      
      - name: 📥 下载 FFmpeg (Windows)
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $ffmpegZip = "ffmpeg.zip"
          
          Write-Host "📥 下载 FFmpeg from $ffmpegUrl"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          
          # 解压到临时目录
          Expand-Archive -Path $ffmpegZip -DestinationPath "ffmpeg-temp" -Force
          
          # 创建目标目录并移动文件
          New-Item -ItemType Directory -Force -Path "vendor/windows/ffmpeg/bin"
          
          # 找到解压后的目录（名称可能包含版本号）
          $extractedDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
          Copy-Item "$($extractedDir.FullName)/bin/ffmpeg.exe" "vendor/windows/ffmpeg/bin/"
          Copy-Item "$($extractedDir.FullName)/bin/ffprobe.exe" "vendor/windows/ffmpeg/bin/"
          Copy-Item "$($extractedDir.FullName)/LICENSE.txt" "vendor/windows/ffmpeg/" -ErrorAction Stop
          
          # 清理
          Remove-Item $ffmpegZip
          Remove-Item -Recurse -Force "ffmpeg-temp"
          
          Write-Host "✅ FFmpeg 安装完成"
          dir "vendor/windows/ffmpeg/bin"
      
      - name: 🔧 安装 Node 依赖
        run: npm ci
      
      - name: Test compatibility and security
        run: |
          node scripts/check-security-boundaries.cjs
          node scripts/check-safe-extract.cjs
          node scripts/check-batch-preview-follow.cjs
          node scripts/check-scroll-preset-duration.cjs
          node scripts/check-queue-features.cjs
          node scripts/check-edge-tts.cjs
      - name: 🏗️ 构建前端
        run: npm run build
      
      - name: 📦 打包 Windows x64
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Include release notes
        shell: pwsh
        run: Copy-Item docs/RELEASE_4.4.41.md dist-electron/RELEASE_NOTES.md
      - name: 📤 上传 Windows 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-builds
          path: |
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/RELEASE_NOTES.md
            dist-electron/*.blockmap
          retention-days: 30

  build-mac:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare verified native Python and FFmpeg
        run: node scripts/prepare-macos-runtime.cjs ${{ matrix.arch }}
      - name: Build and test
        run: |
          node scripts/check-security-boundaries.cjs
          node scripts/check-safe-extract.cjs
          node scripts/check-batch-preview-follow.cjs
          node scripts/check-scroll-preset-duration.cjs
          npm run build
      - name: Package macOS
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve architecture-specific update metadata
        run: node -e "const fs=require('fs'),yaml=require('js-yaml'); fs.writeFileSync('dist-electron/latest-mac-${{ matrix.arch }}.json',JSON.stringify(yaml.load(fs.readFileSync('dist-electron/latest-mac.yml','utf8'))))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-builds
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac-*.json
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: 📢 创建 GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write
      contents: write
      attestations: write
    
    steps:
      - name: 📥 下载所有产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-builds
          merge-multiple: true
      
      - name: 📋 列出文件
        run: ls -la all-builds/

      - name: 🧹 清理多余文件
        run: |
          rm -f all-builds/builder-debug.yml

      - name: Merge macOS update metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('all-builds')
          intel = json.loads((root / 'latest-mac-x64.json').read_text())
          arm = json.loads((root / 'latest-mac-arm64.json').read_text())
          assert intel['version'] == arm['version']
          intel['files'] += arm['files']
          for entry in intel['files']:
              assert (root / entry['url']).is_file(), entry['url']
          (root / 'latest-mac.yml').write_text(json.dumps(intel, indent=2) + '\n')
          for file in root.glob('latest-mac-*.json'):
              file.unlink()
          PY

      - name: Generate SHA256 checksums
        run: |
          cd all-builds
          sha256sum * > ../checksums.sha256
          mv ../checksums.sha256 .

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'all-builds/*'
      
      - name: 🎉 创建 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: all-builds/*
          draft: false
          generate_release_notes: true
          body_path: all-builds/RELEASE_NOTES.md
